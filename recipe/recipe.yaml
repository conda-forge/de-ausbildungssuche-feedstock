schema_version: 1

context:
  name: de-ausbildungssuche
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/de-ausbildungssuche-${{ version }}.tar.gz
  sha256: a6744de21af6e3b1abc223381eb67aafc085fc5ee0822e8d0635d9bed7360552

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.ausbildungssuche
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Arbeitsagentur Ausbildungssuche API
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/bundesAPI/ausbildungssuche-api

extra:
  recipe-maintainers:
    - jan-janssen
